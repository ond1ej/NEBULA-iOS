# Weekly update pull requests for the pinned GitHub Actions. The apps have no package dependencies to update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
